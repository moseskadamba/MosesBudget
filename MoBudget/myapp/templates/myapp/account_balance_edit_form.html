
<div class="modal fade" id="editAccountModal-{{ acc.id }}" tabindex="-1" aria-labelledby="editAccountModalLabel-{{ acc.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 15px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="editAccountModalLabel-{{ acc.id }}">
                    <i class="bi bi-pencil-square text-warning me-2"></i>Edit {{ acc.account_name }}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3">
                <p class="text-muted small mb-4">Update the account details or make corrections to your current balance.</p>

                <form method="POST" action="{% url 'expenses:edit_account_balance' acc.id %}" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-medium">Account Name</label>
                        <input type="text" name="account_name" value="{{ acc.account_name }}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-medium">Account Type</label>
                        <select name="account_type" class="form-select">
                            <option value="bank" {% if acc.account_type == 'bank' %}selected{% endif %}>Bank Account</option>
                            <option value="mobile_money" {% if acc.account_type == 'mobile_money' %}selected{% endif %}>Mobile Money (e.g., M-Pesa)</option>
                            <option value="cash" {% if acc.account_type == 'cash' %}selected{% endif %}>Cash on Hand</option>
                            <option value="credit" {% if acc.account_type == 'credit' %}selected{% endif %}>Credit Card/Loan</option>
                            <option value="jobs" {% if acc.account_type == 'jobs' %}selected{% endif %}>Job Account</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-medium">Current Balance</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">Ksh</span>
                            <input type="number" name="balance" value="{{ acc.balance|stringformat:".2f" }}" step="0.01" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-medium">Notes</label>
                        <textarea name="notes" class="form-control" rows="3">{{ acc.notes|default_if_none:"" }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning text-dark fw-bold px-4 py-2 w-100 shadow-sm">
                            <i class="bi bi-check-circle me-2"></i>Save Changes
                        </button>
                        <button type="button" class="btn btn-light px-4 py-2 w-100 text-muted border" data-bs-dismiss="modal">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
