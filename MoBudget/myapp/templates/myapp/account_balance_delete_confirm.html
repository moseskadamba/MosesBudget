<div class="modal fade" id="deleteAccountModal-{{ acc.id }}" tabindex="-1" aria-labelledby="deleteAccountModalLabel-{{ acc.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow" style="border-radius: 15px;">
            <div class="modal-body text-center p-4">
                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-triangle-fill display-5"></i>
                </div>
                
                <h5 class="fw-bold text-dark mb-2">Delete Account?</h5>
                <p class="text-muted small mb-4">Are you sure you want to delete <strong>{{ acc.account_name }}</strong>? This will permanently remove its tracking history.</p>
                
                <form method="POST" action="{% url 'expenses:delete_account_balance' acc.id %}">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger py-2 fw-semibold shadow-sm">
                            Confirm Delete
                        </button>
                        <button type="button" class="btn btn-light py-2 border text-muted" data-bs-dismiss="modal">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
